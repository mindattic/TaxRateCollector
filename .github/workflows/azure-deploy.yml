name: Build and deploy TaxRateCollector to Azure App Service

# Deploys the Blazor site only (TaxRateCollector.Worker stays on the dev PC):
#   build   restore, build, unit tests, publish TaxRateCollector.Blazor as an artifact
#   deploy  push the artifact to the `taxratecollector` App Service and wait for /healthz
#
# The App Service (resource group MyApps, Windows plan ASP-MyApps-99fe, .NET 10) runs from the
# deployed package (WEBSITE_RUN_FROM_PACKAGE=1) and reaches the Azure SQL database
# `TaxRateCollector` with its managed identity; there is no password anywhere.
#
# Authentication is GitHub OIDC: the app registration `gh-mindattic-webapps-deploy` trusts
# `repo:mindattic/TaxRateCollector:ref:refs/heads/main` and is Website Contributor on this one site.
# Its ids are the repo secrets AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID.
#
# The site is NOT open to the internet: most pages have no [Authorize], so an App Service access
# restriction allows only the owner's IP. The deploy job lets its own runner in for the health
# check and removes that rule again, whatever happens.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.agent/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # required by azure/login's OIDC flow

concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  PUBLISH_PROJECT: TaxRateCollector.Blazor/TaxRateCollector.Blazor.csproj
  TEST_PROJECT: TaxRateCollector.UnitTests/TaxRateCollector.UnitTests.csproj
  AZURE_RESOURCE_GROUP: MyApps
  APP: taxratecollector
  DOTNET_VERSION: '10.x'

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # MindAttic.Legion and MindAttic.Vault come from the git-tracked lib/local-packages feed. A
      # GitHub runner has no C:\LocalNuGet; --ignore-failed-sources lets NuGet skip that source.
      - name: Restore
        run: |
          dotnet restore ${{ env.PUBLISH_PROJECT }} --ignore-failed-sources
          dotnet restore ${{ env.TEST_PROJECT }} --ignore-failed-sources

      - name: Build
        run: |
          dotnet build ${{ env.PUBLISH_PROJECT }} -c Release --no-restore
          dotnet build ${{ env.TEST_PROJECT }} -c Release --no-restore

      - name: Run unit tests
        run: dotnet test ${{ env.TEST_PROJECT }} -c Release --no-build --filter "Category!=Integration" -v m

      - name: Publish
        run: dotnet publish ${{ env.PUBLISH_PROJECT }} -c Release -o publish --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: taxratecollector-app
          path: publish/

  deploy:
    runs-on: windows-2025
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: taxratecollector-app
          path: publish/

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP }}
          package: publish/

      # The package is mounted, not copied, so the running process has to be replaced to pick it up.
      - name: Restart onto the new build
        shell: pwsh
        run: az webapp restart --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name $env:APP

      # The site only admits the owner's IP, and a hosted runner has no stable one: admit this
      # runner for the check and remove the rule in the always() step below.
      - name: Let this runner through the access restriction
        id: access
        shell: pwsh
        run: |
          $ip = (Invoke-RestMethod 'https://api.ipify.org?format=json').ip
          $rule = "gh-$($env:GITHUB_RUN_ID)"
          az webapp config access-restriction add --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name $env:APP `
            --rule-name $rule --action Allow --ip-address "$ip/32" --priority 200 --output none
          if ($LASTEXITCODE) { throw 'Could not add the access rule.' }
          "rule=$rule" | Out-File $env:GITHUB_OUTPUT -Append

      # Startup migrates and seeds before it listens, and the database auto-pauses: the first
      # connection after a pause takes about a minute. /healthz answers once startup is through.
      - name: Smoke-test /healthz and the login page
        shell: pwsh
        run: |
          $base = "https://$env:APP.azurewebsites.net"
          foreach ($path in '/healthz', '/login') {
            $ok = $false
            $deadline = (Get-Date).AddMinutes(12)
            while (-not $ok -and (Get-Date) -lt $deadline) {
              try {
                $r = Invoke-WebRequest -Uri "$base$path" -UseBasicParsing -TimeoutSec 120
                if ($r.StatusCode -eq 200) { $ok = $true; Write-Host "${path}: 200" }
              } catch { Write-Host "${path}: $($_.Exception.Message)" }
              if (-not $ok) { Start-Sleep -Seconds 15 }
            }
            if (-not $ok) { throw "$base$path never returned 200." }
          }

      - name: Remove the runner's access rule
        if: always() && steps.access.outputs.rule != ''
        shell: pwsh
        run: |
          az webapp config access-restriction remove --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --name $env:APP `
            --rule-name '${{ steps.access.outputs.rule }}' --output none
